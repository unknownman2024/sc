name: BMS Advance Far 1to8 + Combine

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"

permissions:
  contents: write
  actions: read

env:
  PRIVATE_REPO: unknownman2024/assetz

jobs:

# =====================================================
# 0️⃣ PRECHECK + ROTATING DATE (+2/+3/+4/+5)
# =====================================================
  precheck:
    name: Precheck + rotating date
    runs-on: ubuntu-latest
    outputs:
      should_run:    ${{ steps.check.outputs.should_run }}
      days_ahead:    ${{ steps.set.outputs.days_ahead }}
      date_code:     ${{ steps.set.outputs.date_code }}
      date_district: ${{ steps.set.outputs.date_district }}
      base_dir:      ${{ steps.set.outputs.base_dir }}
      log_root:      ${{ steps.set.outputs.log_root }}

    steps:
      - name: Check running advance-far workflows
        id: check
        uses: actions/github-script@v7
        with:
          script: |
            const runs = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner, repo: context.repo.repo,
              workflow_id: "advancefar.yml", status: "in_progress", per_page: 100
            });
            const otherRuns = runs.data.workflow_runs.filter(r => r.id !== context.runId);
            core.setOutput("should_run", otherRuns.length > 0 ? "false" : "true");

      - name: Decide tracking day (FREEZE)
        id: set
        run: |
          set -euo pipefail

          # Force base-10 to avoid octal parse errors on hours like 08, 09
          RUN_INDEX=$(date -u +%H)
          RUN_INDEX=$((10#$RUN_INDEX))

          ARR=(2 3 4 2 5 3 4)
          LEN=${#ARR[@]}
          IDX=$((RUN_INDEX % LEN))
          DAYS_AHEAD=${ARR[$IDX]}

          DATE_CODE=$(TZ=Asia/Kolkata date -d "+${DAYS_AHEAD} day" +%Y%m%d)
          DATE_DISTRICT=$(TZ=Asia/Kolkata date -d "+${DAYS_AHEAD} day" +%Y-%m-%d)
          BASE_DIR="output/advance/data/${DATE_CODE}"
          LOG_ROOT="output/advance/logs"

          echo "Run index  : $RUN_INDEX"
          echo "Day offset : +$DAYS_AHEAD"
          echo "DATE_CODE  : $DATE_CODE"
          echo "DATE_DIST  : $DATE_DISTRICT"
          echo "BASE_DIR   : $BASE_DIR"

          echo "days_ahead=$DAYS_AHEAD"       >> "$GITHUB_OUTPUT"
          echo "date_code=$DATE_CODE"         >> "$GITHUB_OUTPUT"
          echo "date_district=$DATE_DISTRICT" >> "$GITHUB_OUTPUT"
          echo "base_dir=$BASE_DIR"           >> "$GITHUB_OUTPUT"
          echo "log_root=$LOG_ROOT"           >> "$GITHUB_OUTPUT"

# =====================================================
# 1️⃣ SHARDS 1–8 ONLY (NO SHARD 9)
# =====================================================
  shards:
    name: Shard ${{ matrix.shard }} (+${{ needs.precheck.outputs.days_ahead }}d)
    needs: precheck
    if: needs.precheck.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: [1,2,3,4,5,6,7,8]

    steps:
      - name: 🧾 Checkout public code repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🧾 Checkout private assetz repo (into output/)
        uses: actions/checkout@v4
        with:
          repository: ${{ env.PRIVATE_REPO }}
          token:      ${{ secrets.PRIVATE_REPO_PAT }}
          path:       output
          fetch-depth: 0

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 🔓 Decrypt Python files
        env:
          CODE_ENCRYPTION_PASSWORD: ${{ secrets.CODE_ENCRYPTION_PASSWORD }}
        run: |
          if [ -z "${CODE_ENCRYPTION_PASSWORD:-}" ]; then
            echo "❌ CODE_ENCRYPTION_PASSWORD secret not set"
            exit 1
          fi
          python3 -m pip install --quiet --disable-pip-version-check cryptography
          python3 - <<'PYEOF'
          import os, sys
          from pathlib import Path
          from cryptography.hazmat.primitives import hashes
          from cryptography.hazmat.primitives.kdf.pbkdf2 import PBKDF2HMAC
          from cryptography.hazmat.primitives.ciphers.aead import AESGCM

          MAGIC       = b"PYENC1"
          SALT_LEN    = 16
          NONCE_LEN   = 12
          PBKDF2_ITER = 600_000

          pw = os.environ.get("CODE_ENCRYPTION_PASSWORD", "")
          if not pw:
              print("❌ CODE_ENCRYPTION_PASSWORD not set")
              sys.exit(1)
          password = pw.encode()

          count = 0
          for path in Path(".").glob("*.py"):
              data = path.read_bytes()
              if not data.startswith(MAGIC):
                  continue
              body  = data[len(MAGIC):]
              salt  = body[:SALT_LEN]
              nonce = body[SALT_LEN:SALT_LEN+NONCE_LEN]
              ct    = body[SALT_LEN+NONCE_LEN:]
              try:
                  kdf = PBKDF2HMAC(
                      algorithm=hashes.SHA256(),
                      length=32,
                      salt=salt,
                      iterations=PBKDF2_ITER,
                  )
                  key = kdf.derive(password)
                  pt  = AESGCM(key).decrypt(nonce, ct, None)
              except Exception as e:
                  print(f"❌ decrypt failed for {path}: {type(e).__name__}")
                  sys.exit(1)
              path.write_bytes(pt)
              count += 1
          print(f"✅ Decrypted {count} Python file(s)")
          PYEOF

      - name: 📦 Install deps
        run: pip install curl_cffi

      - name: 🚀 Run shard (advance fresh)
        env:
          SHARD_ID:       ${{ matrix.shard }}
          MODE:           advance
          DATE_CODE:      ${{ needs.precheck.outputs.date_code }}
          BASE_DIR:       ${{ needs.precheck.outputs.base_dir }}
          CUTOFF_MINUTES: "99999"
        run: python daily.py

      - name: 💾 Commit & push
        working-directory: output
        run: |
          git config user.name  "github-actions"
          git config user.email "actions@github.com"

          git add advance/
          if git diff --cached --quiet; then
            echo "ℹ️ No changes"
            exit 0
          fi

          git commit -m "BMS advance-far shard ${{ matrix.shard }} — ${{ needs.precheck.outputs.date_district }} (+${{ needs.precheck.outputs.days_ahead }}d)"

          for i in 1 2 3 4 5; do
            git pull --rebase origin main || true
            if git push origin main; then
              echo "✅ Shard push successful"
              exit 0
            fi
            echo "⚠️ Push failed — retrying"
            sleep 3
          done
          git push --force-with-lease origin main || true

# =====================================================
# 2️⃣ COMBINER
# =====================================================
  combine:
    name: Combine advance-far shards
    needs: [precheck, shards]
    if: always() && needs.precheck.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: bms-advance-far-combiner
      cancel-in-progress: false

    steps:
      - name: 🧾 Checkout public code repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🧾 Checkout private assetz repo
        uses: actions/checkout@v4
        with:
          repository: ${{ env.PRIVATE_REPO }}
          token:      ${{ secrets.PRIVATE_REPO_PAT }}
          path:       output
          fetch-depth: 0

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 🔁 Combine + push
        env:
          MODE:          advance
          DATE_CODE:     ${{ needs.precheck.outputs.date_code }}
          DATE_DISTRICT: ${{ needs.precheck.outputs.date_district }}
          BASE_DIR:      ${{ needs.precheck.outputs.base_dir }}
          LOG_ROOT:      ${{ needs.precheck.outputs.log_root }}
        run: |
          set -e
          pip install pytz

          MAX_TRIES=6
          TRY=1
          while [ $TRY -le $MAX_TRIES ]; do
            echo "🔁 Advance-far combine attempt $TRY / $MAX_TRIES"

            cd output
            git config user.name  "github-actions"
            git config user.email "actions@github.com"
            git fetch origin main && git reset --hard origin/main

            cd ..
            python combine_dailyshards.py

            cd output
            git add advance/
            if git diff --cached --quiet; then
              echo "✅ No changes after combine"
              exit 0
            fi

            git commit -m "Final combined advance-far — ${{ needs.precheck.outputs.date_district }} (+${{ needs.precheck.outputs.days_ahead }}d)"

            if git push origin main; then
              echo "✅ Combine push successful"
              exit 0
            fi
            echo "⚠️ Push failed — retrying"
            TRY=$((TRY+1))
            sleep 5
          done
          echo "❌ Combine failed after $MAX_TRIES attempts"
          exit 1

# =====================================================
# 3️⃣ AUTO RETRY COMBINER
# =====================================================
  retry-combine:
    name: Auto retry advance-far combine
    needs: [precheck, combine]
    if: always() && needs.combine.result == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: bms-advance-far-combiner
      cancel-in-progress: false

    steps:
      - name: 🧾 Checkout public code repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🧾 Checkout private assetz repo
        uses: actions/checkout@v4
        with:
          repository: ${{ env.PRIVATE_REPO }}
          token:      ${{ secrets.PRIVATE_REPO_PAT }}
          path:       output
          fetch-depth: 0

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 🔁 Retry combine + push
        env:
          MODE:          advance
          DATE_CODE:     ${{ needs.precheck.outputs.date_code }}
          DATE_DISTRICT: ${{ needs.precheck.outputs.date_district }}
          BASE_DIR:      ${{ needs.precheck.outputs.base_dir }}
          LOG_ROOT:      ${{ needs.precheck.outputs.log_root }}
        run: |
          set -e
          pip install pytz

          MAX_TRIES=6
          TRY=1
          while [ $TRY -le $MAX_TRIES ]; do
            echo "🔁 AUTO RETRY — Advance-far combine attempt $TRY / $MAX_TRIES"

            cd output
            git config user.name  "github-actions"
            git config user.email "actions@github.com"
            git fetch origin main && git reset --hard origin/main

            cd ..
            python combine_dailyshards.py

            cd output
            git add advance/
            if git diff --cached --quiet; then
              echo "✅ No changes after retry combine"
              exit 0
            fi

            git commit -m "Final combined advance-far — ${{ needs.precheck.outputs.date_district }} (+${{ needs.precheck.outputs.days_ahead }}d) — retry"

            if git push origin main; then
              echo "✅ AUTO RETRY COMBINE PUSH SUCCESSFUL"
              exit 0
            fi
            echo "⚠️ Retry push failed"
            TRY=$((TRY+1))
            sleep 5
          done
          echo "❌ Auto retry combiner failed after $MAX_TRIES attempts"
          exit 1
